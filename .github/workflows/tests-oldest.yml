name: Run tests with oldest supported dependencies

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests-oldest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.11"]
    env:
      OS: ubuntu-latest
      PYTHON: ${{ matrix.python-version }}
      UV_NO_SYNC: "1"
    steps:
    - uses: actions/checkout@v6
    - name: Set up uv with python ${{ matrix.python-version }}
      uses: fizyk/actions-reuse/.github/actions/uv-setup@ef34949dba56816730c78752529724b4aa96e557 # v5.8.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Update apt
      run: |
        sudo apt-get update
    - name: Install RabbitMQ
      run: |
        sudo apt-get install -y rabbitmq-server
    - name: Install oldest supported versions
      uses: fizyk/actions-reuse/.github/actions/uv-pip@ef34949dba56816730c78752529724b4aa96e557 # v5.8.0
      with:
        requirements: oldest/requirements.txt
    - name: Run tests without xdist
      uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@ef34949dba56816730c78752529724b4aa96e557 # v5.8.0
      with:
        pytest-opts: -c pyproject.oldest.toml -p no:xdist
        data-file: .coverage.serial
        output-file: coverage-serial.xml
    - name: Run xdist test
      uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@ef34949dba56816730c78752529724b4aa96e557 # v5.8.0
      with:
        pytest-opts: -c pyproject.oldest.toml -n auto --max-worker-restart=0
        coverage-config: .coveragerc
        data-file: .coverage.xdist
        output-file: coverage-xdist.xml
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v6.0.1
      with:
        files: coverage-serial.xml,coverage-xdist.xml
        flags: linux
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
